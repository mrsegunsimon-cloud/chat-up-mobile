name: Build Android test app
on:
  workflow_dispatch:
env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the build tool
        run: npm install -g eas-cli
        working-directory: .
      - name: Put your Supabase details into the build settings
        run: |
          sed -i "s#PASTE_PROJECT_URL_HERE#${{ secrets.SUPABASE_URL }}#g; s#PASTE_PUBLISHABLE_KEY_HERE#${{ secrets.SUPABASE_KEY }}#g" eas.json
      - run: npm install --legacy-peer-deps
      - run: npx expo install --fix
      - name: Link to your Expo project
        run: eas init --non-interactive --force
      - name: Build the Android test app (installable file)
        run: eas build --platform android --profile preview --non-interactive
