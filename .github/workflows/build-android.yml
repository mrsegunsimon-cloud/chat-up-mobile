name: Build Android test app
on:
  workflow_dispatch:
env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the build tool
        run: npm install -g eas-cli
        working-directory: .
      - name: Put your Supabase details into the build settings
        run: |
          sed -i "s#PASTE_PROJECT_URL_HERE#${{ secrets.SUPABASE_URL }}#g; s#PASTE_PUBLISHABLE_KEY_HERE#${{ secrets.SUPABASE_KEY }}#g" eas.json
      - run: npm install --legacy-peer-deps
      - name: Match package versions to Expo
        run: |
          set +e
          OUT=$(CI=1 npx expo install --fix 2>&1); CODE=$?
          echo "$OUT" | tail -30
          if [ $CODE -ne 0 ]; then echo "::error title=expo install failed::$(echo "$OUT" | tail -8 | tr '\n' ' ' | cut -c1-700)"; exit $CODE; fi
      - name: Install packages
        run: |
          set +e
          OUT=$(npm install --legacy-peer-deps 2>&1); CODE=$?
          echo "$OUT" | tail -30
          if [ $CODE -ne 0 ]; then echo "::error title=npm install failed::$(echo "$OUT" | tail -8 | tr '\n' ' ' | cut -c1-700)"; exit $CODE; fi
      - name: Link to your Expo project
        run: |
          set +e
          OUT=$(eas init --non-interactive --force 2>&1); CODE=$?
          echo "$OUT" | tail -30
          if [ $CODE -ne 0 ]; then echo "::error title=eas init failed::$(echo "$OUT" | tail -8 | tr '\n' ' ' | cut -c1-700)"; exit $CODE; fi
      - name: Build the Android test app (installable file)
        run: |
          set +e
          OUT=$(eas build --platform android --profile preview --non-interactive 2>&1); CODE=$?
          echo "$OUT" | tail -40
          if [ $CODE -ne 0 ]; then echo "::error title=eas build failed::$(echo "$OUT" | tail -10 | tr '\n' ' ' | cut -c1-900)"; exit $CODE; fi
      - name: Fetch the Expo build log when the build fails
        if: failure()
        run: |
          set +e
          ID=$(eas build:list --platform android --limit 1 --json --non-interactive 2>/dev/null | python3 -c "import sys,json;print(json.load(sys.stdin)[0]['id'])")
          eas build:view "$ID" --json > /tmp/b.json 2>/tmp/b.err
          python3 - <<'PY'
          import json,urllib.request,re,zlib,gzip
          try:
              raw=open('/tmp/b.json').read()
              b=json.loads(raw)
              print('keys:',list(b.keys()))
              urls=b.get('logFiles') or []
              print('logfiles:',len(urls))
              txt=''
              for u in urls:
                  d=urllib.request.urlopen(u,timeout=60).read()
                  print('magic',d[:4].hex(),len(d))
                  for wb in (47,-15,15):
                      try:
                          d=zlib.decompress(d,wb); break
                      except Exception: pass
                  else:
                      try:
                          import brotli; d=brotli.decompress(d)
                      except Exception: pass
                  txt+=d.decode('utf8','ignore')
              msgs=[]
              for l in txt.splitlines():
                  try:
                      o=json.loads(l); msgs.append((o.get('phase',''),str(o.get('msg',''))))
                  except Exception:
                      msgs.append(('',l))
              print('lines',len(msgs),'urls',len(urls))
              pre=[m for ph,m in msgs if 'PREBUILD' in str(ph).upper() or 'rror' in m]
              out=' | '.join(m.strip()[:300] for m in (pre or [m for _,m in msgs])[-8:])
              print('::error title=Expo build log::'+out[:1700])
          except Exception as e:
              print('::error title=Could not read the Expo log::'+str(e)[:400]+' '+open('/tmp/b.err').read()[:300].replace(chr(10),' '))
          PY
        working-directory: app
