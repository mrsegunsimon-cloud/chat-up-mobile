name: Set up Chat Up database
on:
  workflow_dispatch:
jobs:
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the database tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Run all Chat Up SQL in one go (all or nothing)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$DB_URL" || { echo "Missing the SUPABASE_DB_URL secret"; exit 1; }
          set +e
          OUT=$(psql "$DB_URL" --single-transaction -v ON_ERROR_STOP=1 -f app/supabase/ALL_IN_ONE.sql 2>&1)
          CODE=$?
          echo "$OUT" | tail -25
          if [ $CODE -ne 0 ]; then
            echo "::error title=SQL failed (code $CODE)::$(echo "$OUT" | tail -6 | tr '\n' ' ' | cut -c1-600)"
            exit $CODE
          fi
      - name: List the tables that now exist
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$DB_URL" -c "select table_name from information_schema.tables where table_schema='public' order by 1;"
